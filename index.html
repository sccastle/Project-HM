<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>HM</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="description" content="家长端作业管理：老师原文归档、AI 整理作业清单、数学知识点脉络、英语提词。数据只存在本机。">
<meta name="theme-color" content="#02a4dc">
<meta name="color-scheme" content="light">

<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="HM">
<meta name="format-detection" content="telephone=no">

<style>
/* 小萄作业管家 — 家长端 PWA
   视觉：70% 克制的现代教育工具 + 30% comic / paper-cut 个性
   主色取自 Logo 与 concept board 的青蓝 #02A4DC */

:root {
  --blue: #02a4dc;
  --blue-press: #0189b8;
  --blue-ink: #06405c;
  --blue-wash: #e4f5fd;
  --paper: #f6f4ee;
  --card: #ffffff;
  --ink: #141414;
  --ink-2: #4a5157;
  --ink-3: #8b9298;
  --line: #dcd8cd;
  --red: #e2352b;
  --yellow: #f5c518;
  --green: #2e9e5b;

  --r-lg: 18px;
  --r-md: 12px;
  --r-sm: 8px;
  --shadow: 3px 3px 0 var(--ink);
  --shadow-soft: 0 2px 0 var(--line);

  --nav-h: 62px;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);

  /* 折叠屏适配：内容最大宽度 + 侧边导航宽度，随断点改写 */
  --maxw: 100%;
  --rail: 0px;
  --pad: 16px;

  --font: system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB",
    "Microsoft YaHei", "Noto Sans SC", sans-serif;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

/* 滚动交给浏览器自己管：html / body 上不设 height、不设 overflow。
   任何一个都可能让 body 变成滚动容器，在部分安卓机上表现为「页面划不动」。 */
html, body {
  margin: 0;
  padding: 0;
}

html { -webkit-text-size-adjust: 100%; }

body {
  font-family: var(--font);
  background: var(--paper);
  color: var(--ink);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

/* 打开抽屉时锁住背景滚动，锁在 html 上，关掉就一定能恢复 */
html.sheet-open, html.sheet-open body { overflow: hidden; }

button, input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; padding: 0; }
a { color: var(--blue-press); }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

/* ---------- 布局骨架 ---------- */

#app {
  /* 用 vh 而不是 100%：html / body 不再定高，整页交给浏览器滚，
     地址栏能自动收起，切页时 window.scrollTo(0,0) 也才真的有效 */
  min-height: 100vh;
  min-height: 100dvh;
  padding-bottom: calc(var(--nav-h) + var(--sab));
  /* clip 只裁切、不产生滚动容器；不支持 clip 的老浏览器退回 hidden */
  overflow-x: hidden;
  overflow-x: clip;
}

.screen { display: none; }
.screen.active { display: block; }

.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  background: var(--blue);
  color: #fff;
  padding: calc(var(--sat) + 14px) var(--pad) 16px;
  border-bottom: 2px solid var(--ink);
  background-image: radial-gradient(rgba(255, 255, 255, 0.22) 1px, transparent 1px);
  background-size: 9px 9px;
  background-position: right -4px top -4px;
}

.topbar > * {
  max-width: var(--maxw);
  margin-left: auto;
  margin-right: auto;
}

.topbar-row {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 34px;
}

.topbar h1 {
  margin: 0;
  font-size: 20px;
  font-weight: 800;
  letter-spacing: 0.5px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.topbar h1 img { width: 30px; height: 30px; border-radius: 8px; display: block; }

.topbar .sub {
  margin: 6px auto 0;
  font-size: 13px;
  color: rgba(255, 255, 255, 0.9);
}

.grade-pill {
  margin-left: auto;
  background: #fff;
  color: var(--blue-ink);
  border: 2px solid var(--ink);
  border-radius: 999px;
  padding: 5px 12px;
  font-size: 14px;
  font-weight: 700;
  box-shadow: 2px 2px 0 var(--ink);
  white-space: nowrap;
}

.back-btn {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.18);
  border: 2px solid rgba(255, 255, 255, 0.75);
  color: #fff;
  font-size: 18px;
  line-height: 1;
  display: grid;
  place-items: center;
  flex: none;
}

.content {
  padding: var(--pad) var(--pad) 28px;
  max-width: var(--maxw);
  margin: 0 auto;
}
.content.tight { padding-top: 12px; }

/* ---------- 排版零件 ---------- */

.tag-head {
  display: inline-block;
  background: var(--ink);
  color: #fff;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 1px;
  padding: 4px 12px 5px;
  transform: skewX(-8deg);
  margin: 0 0 12px;
}
.tag-head span { display: inline-block; transform: skewX(8deg); }

.section { margin-bottom: 24px; }
.muted { color: var(--ink-3); font-size: 13px; }
.hint { color: var(--ink-2); font-size: 13px; line-height: 1.6; }
.spacer { height: 8px; }

.date-strip {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 14px;
}
.date-strip button {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  border: 2px solid var(--ink);
  background: #fff;
  font-size: 16px;
  font-weight: 700;
  flex: none;
}
.date-strip .cur {
  flex: 1;
  text-align: center;
  font-weight: 800;
  font-size: 16px;
  background: #fff;
  border: 2px solid var(--ink);
  border-radius: 10px;
  height: 36px;
  line-height: 32px;
  box-shadow: var(--shadow);
}
.date-strip .cur.today { background: var(--yellow); }

/* ---------- 卡片 ---------- */

.card {
  background: var(--card);
  border: 2px solid var(--ink);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow);
  padding: 14px;
  margin-bottom: 14px;
}

.course-card {
  display: block;
  width: 100%;
  text-align: left;
  cursor: pointer;
}
.course-card:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

.course-head { display: flex; align-items: center; gap: 12px; }

/* 当天作业直接摊开在首页，卡片高度跟着内容走，不截断 */
.course-tasks { margin-top: 12px; }
.mini-task {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  padding: 7px 0;
  border-top: 1px dashed var(--line);
  font-size: 15px;
  line-height: 1.45;
}
.mini-tick {
  flex: none;
  width: 18px;
  height: 18px;
  margin-top: 2px;
  border: 2px solid var(--ink);
  border-radius: 5px;
  background: #fff;
  display: grid;
  place-items: center;
  font-size: 12px;
  font-weight: 900;
  line-height: 1;
}
.mini-task.done .mini-tick { background: var(--blue); border-color: var(--blue); color: #fff; }
.mini-text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.mini-task.done .mini-text { text-decoration: line-through; color: var(--ink-2); }
.mini-tag {
  display: inline-block;
  margin-left: 6px;
  font-size: 11px;
  font-weight: 800;
  padding: 1px 6px;
  border-radius: 999px;
  border: 1.5px solid var(--line);
  color: var(--ink-2);
  background: #f5f3ed;
  vertical-align: 1px;
}
.mini-tag.parent { border-color: #e8c33a; background: #fdf6dc; color: #7a5d00; }
.mini-tag.reminder { border-color: #e46b5f; background: #fdeceb; color: #94322a; }

.course-raw {
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px dashed var(--line);
  font-size: 14.5px;
  line-height: 1.55;
  color: var(--ink-2);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.course-foot {
  margin-top: 10px;
  font-size: 12.5px;
  color: var(--ink-2);
}
.course-foot.na { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); }

.avatar {
  width: 46px;
  height: 46px;
  border-radius: 12px;
  border: 2px solid var(--ink);
  background: var(--blue-wash);
  display: grid;
  place-items: center;
  font-size: 20px;
  font-weight: 800;
  color: var(--blue-ink);
  flex: none;
  overflow: hidden;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }

.course-main { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 1px; }
.course-name { display: block; font-weight: 800; font-size: 17px; line-height: 1.3; }
.course-teacher { display: block; font-size: 13px; color: var(--ink-2); line-height: 1.4; }
.course-meta { font-size: 13px; color: var(--ink-2); margin-top: 5px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

.badge {
  display: inline-block;
  font-size: 12px;
  font-weight: 700;
  padding: 1px 8px;
  border-radius: 999px;
  border: 1.5px solid var(--ink);
  background: #fff;
}
.badge.done { background: #dff3e6; }
.badge.todo { background: var(--yellow); }
.badge.na { background: #f0efe9; color: var(--ink-2); border-color: var(--line); }

.chev { color: var(--ink-3); font-size: 20px; flex: none; }

/* ---------- 按钮 ---------- */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border: 2px solid var(--ink);
  border-radius: var(--r-md);
  background: #fff;
  padding: 11px 16px;
  font-weight: 700;
  font-size: 15px;
  box-shadow: 2px 2px 0 var(--ink);
  transition: transform 0.06s, box-shadow 0.06s;
}
.btn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--ink); }
.btn.primary { background: var(--blue); color: #fff; }
.btn.dark { background: var(--ink); color: #fff; }
.btn.danger { background: #fff; color: var(--red); border-color: var(--red); box-shadow: 2px 2px 0 var(--red); }
.btn.ghost { box-shadow: none; border-color: var(--line); background: #fff; font-weight: 600; }
.btn.block { display: flex; width: 100%; }
.btn.sm { padding: 7px 12px; font-size: 13px; border-radius: 9px; }
.btn[disabled] { opacity: 0.5; pointer-events: none; }

.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn-row .btn { flex: 1; }

/* ---------- 表单 ---------- */

.field { margin-bottom: 14px; }
.field label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; color: var(--ink-2); }

input[type="text"], input[type="password"], input[type="date"], input[type="url"], textarea, select {
  width: 100%;
  border: 2px solid var(--ink);
  border-radius: var(--r-md);
  background: #fff;
  padding: 11px 12px;
  font-size: 16px; /* 16px 防止 iOS 聚焦缩放 */
  line-height: 1.5;
  appearance: none;
}
textarea { min-height: 130px; resize: vertical; }
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-wash); }

.input-row { display: flex; gap: 8px; align-items: center; }
.input-row input { flex: 1; }

.switch-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
}
.switch-row .switch-text { flex: 1; }
.switch-row .switch-text b { display: block; font-size: 15px; }

.switch {
  width: 50px;
  height: 30px;
  border-radius: 999px;
  border: 2px solid var(--ink);
  background: #e8e6de;
  position: relative;
  flex: none;
  transition: background 0.15s;
}
.switch i {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: #fff;
  border: 2px solid var(--ink);
  transition: transform 0.15s;
}
.switch.on { background: var(--blue); }
.switch.on i { transform: translateX(20px); }

/* ---------- 任务 checklist ---------- */

.task-group { margin-bottom: 14px; }
.task-group-title {
  font-size: 13px;
  font-weight: 800;
  color: var(--ink-2);
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.task-group-title::before {
  content: "";
  width: 10px;
  height: 10px;
  border: 2px solid var(--ink);
  background: var(--blue);
  transform: rotate(45deg);
}
.task-group.parent .task-group-title::before { background: var(--yellow); }
.task-group.reminder .task-group-title::before { background: var(--red); }

.task {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 9px 0;
  border-bottom: 1px dashed var(--line);
}
.task:last-child { border-bottom: none; }

.tick {
  width: 24px;
  height: 24px;
  border: 2px solid var(--ink);
  border-radius: 6px;
  background: #fff;
  flex: none;
  margin-top: 1px;
  display: grid;
  place-items: center;
  font-size: 15px;
  color: transparent;
  line-height: 1;
}
.tick.on { background: var(--blue); color: #fff; }

.task-text { flex: 1; font-size: 15px; line-height: 1.5; word-break: break-word; }
.task.done .task-text { color: var(--ink-3); text-decoration: line-through; }
.task-x { color: var(--ink-3); font-size: 18px; padding: 0 2px; flex: none; }

.raw-text {
  white-space: pre-wrap;
  word-break: break-word;
  background: var(--paper);
  border: 1.5px solid var(--line);
  border-radius: var(--r-md);
  padding: 12px;
  font-size: 15px;
  line-height: 1.7;
  max-height: 240px;
  overflow: auto;
}

/* ---------- 课程详情内的分段 ---------- */

.seg {
  display: flex;
  gap: 6px;
  background: rgba(255, 255, 255, 0.25);
  border: 2px solid var(--ink);
  border-radius: 12px;
  padding: 3px;
  margin-top: 12px;
}
.seg button {
  flex: 1;
  padding: 7px 4px;
  border-radius: 8px;
  font-weight: 800;
  font-size: 14px;
  color: #fff;
}
.seg button.on { background: #fff; color: var(--blue-ink); }

/* ---------- 结果列表（单词 / 知识点） ---------- */

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 2px solid var(--ink);
  border-radius: 999px;
  background: #fff;
  padding: 5px 12px;
  font-size: 14px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.chip.blue { background: var(--blue-wash); }
.chip button { color: var(--ink-3); font-size: 15px; line-height: 1; }
/* 重复出现过的单词，右上角标出现次数 */
.chip .chip-n {
  font-style: normal;
  font-size: 11px;
  font-weight: 800;
  color: #fff;
  background: var(--ink);
  border-radius: 999px;
  padding: 0 5px;
  line-height: 15px;
}

.list-lines { margin: 0; padding-left: 18px; }
.list-lines li { padding: 3px 0; font-size: 15px; }

/* ---------- 阶段性作业置顶条 ---------- */

.pin-wrap { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
.pin {
  width: 100%;
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 3px;
  padding: 12px 14px;
  border: 2px solid var(--ink);
  border-radius: 16px;
  background: #fff8dc;
  box-shadow: var(--shadow);
}
.pin.soon { background: #ffeede; }
.pin.over { background: #fdeceb; }
.pin.done { background: #f2f1ec; box-shadow: none; }
.pin-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pin-course { font-size: 12px; font-weight: 800; color: var(--ink-2); }
.pin-left {
  font-size: 12px;
  font-weight: 800;
  padding: 2px 9px;
  border-radius: 999px;
  border: 2px solid var(--ink);
  background: #fff;
}
.pin.soon .pin-left { background: var(--yellow, #ffd23f); }
.pin.over .pin-left { background: #e46b5f; color: #fff; border-color: #b3453a; }
.pin-text { font-size: 16px; font-weight: 700; line-height: 1.4; overflow-wrap: anywhere; }
.pin.done .pin-text { text-decoration: line-through; color: var(--ink-2); }
.pin-due { font-size: 12px; color: var(--ink-2); }
.lp-hint { margin: 2px 2px 0; font-size: 11.5px; color: var(--ink-3); }

/* 清单里的截止标签 */
.task, .pin { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }

/* 阶段性作业在清单里不用勾选框，完成在置顶那边做 */
.tick.pinned {
  background: #ffd23f;
  color: var(--ink);
  font-size: 12px;
  cursor: default;
}

.due-tag {
  display: inline-block;
  margin-left: 8px;
  font-size: 11px;
  font-weight: 800;
  padding: 1px 7px;
  border-radius: 999px;
  border: 1.5px solid var(--ink);
  background: #fff8dc;
  vertical-align: 1px;
  white-space: nowrap;
}
.due-tag.over { background: #fdeceb; border-color: #b3453a; color: #94322a; }
.task-group.span-group .task-group-title::before { background: #ffd23f; }

/* ---------- 作业页里可折叠的日历 ---------- */

.cal-toggle {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  margin-bottom: 14px;
  border: 2px solid var(--ink);
  border-radius: 14px;
  background: #fff;
  font-weight: 700;
  font-size: 14px;
}
.cal-toggle svg { width: 18px; height: 18px; }
.cal-toggle .chev { margin-left: auto; font-size: 13px; }
.cal-toggle.on { background: var(--blue-wash); }
.cal-panel {
  border: 2px solid var(--ink);
  border-radius: 16px;
  background: #fff;
  padding: 12px;
  margin: -4px 0 16px;
  box-shadow: var(--shadow);
}
.cal-panel[hidden] { display: none; }

/* ---------- 日历 ---------- */

.cal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.cal-head .m { font-weight: 800; font-size: 18px; }
.cal-head button {
  width: 34px; height: 34px; border-radius: 10px;
  border: 2px solid var(--ink); background: #fff; font-weight: 700;
}

.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-dow { text-align: center; font-size: 12px; color: var(--ink-3); padding: 4px 0; font-weight: 700; }
.cal-cell {
  aspect-ratio: 1 / 1;
  min-width: 0;
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  font-size: 15px;
  border: 2px solid transparent;
  background: #fff;
  color: var(--ink);
  position: relative;
}
.cal-cell.blank { background: transparent; }
.cal-cell.today { border-color: var(--yellow); font-weight: 800; }
.cal-cell.sel { background: var(--blue); color: #fff; border-color: var(--ink); font-weight: 800; }
.cal-cell .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--blue); }
.cal-cell.sel .dot { background: #fff; }

.day-list { margin-top: 18px; }
.day-row {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 12px 14px;
  border: 2px solid var(--ink);
  border-radius: var(--r-md);
  background: #fff;
  margin-bottom: 10px;
  text-align: left;
}
.day-row .n { margin-left: auto; font-size: 13px; color: var(--ink-2); }

/* ---------- 知识脉络 ---------- */

.range-bar { display: flex; gap: 8px; margin-bottom: 14px; }
.range-bar button {
  flex: 1;
  padding: 8px;
  border: 2px solid var(--ink);
  border-radius: 10px;
  background: #fff;
  font-weight: 700;
  font-size: 14px;
}
.range-bar button.on { background: var(--blue); color: #fff; }

.kp-cat { font-weight: 800; font-size: 15px; margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
.kp-cat .count { font-size: 12px; font-weight: 700; color: var(--ink-2); }

.kp-line {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 8px 0 8px 14px;
  border-left: 3px solid var(--blue);
  position: relative;
}
.kp-line::before {
  content: "";
  position: absolute;
  left: -7px;
  top: 15px;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #fff;
  border: 2px solid var(--ink);
}
.kp-name { flex: 1; font-size: 15px; font-weight: 600; }
.kp-meta { font-size: 12px; color: var(--ink-3); white-space: nowrap; }

/* ---------- 管理列表 ---------- */

.manage-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px dashed var(--line);
}
.manage-row:last-child { border-bottom: none; }
.manage-row .m-main { flex: 1; min-width: 0; }
.manage-row .m-main b { display: block; font-size: 15px; }
.manage-row .m-main span { font-size: 13px; color: var(--ink-2); }
.order-btns { display: flex; flex-direction: column; gap: 3px; }
.order-btns button {
  width: 28px; height: 20px; border: 1.5px solid var(--line); border-radius: 6px;
  background: #fff; font-size: 11px; line-height: 1; color: var(--ink-2);
}

/* ---------- 底部导航 ---------- */

.bottom-nav {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 50;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  background: #fff;
  border-top: 2px solid var(--ink);
  padding-bottom: var(--sab);
}
.bottom-nav button {
  height: var(--nav-h);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  font-size: 11px;
  font-weight: 700;
  color: var(--ink-3);
}
.bottom-nav button svg { width: 22px; height: 22px; }
.bottom-nav button.on { color: var(--blue-press); }

/* ---------- 弹层 / 抽屉 ---------- */

.sheet-mask {
  position: fixed;
  inset: 0;
  background: rgba(10, 20, 26, 0.45);
  z-index: 60;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.sheet-mask[hidden] { display: none; }

.sheet {
  width: 100%;
  max-width: 520px;
  max-height: 88vh;
  overflow: auto;
  background: var(--paper);
  border: 2px solid var(--ink);
  border-bottom: none;
  border-radius: 20px 20px 0 0;
  padding: 18px 16px calc(20px + var(--sab));
  animation: rise 0.18s ease-out;
}
@keyframes rise { from { transform: translateY(24px); opacity: 0.4; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }

.sheet h2 { margin: 0 0 4px; font-size: 19px; font-weight: 800; }
.sheet .sheet-sub { margin: 0 0 16px; font-size: 13px; color: var(--ink-2); }
.sheet-actions { display: flex; gap: 10px; margin-top: 18px; }
.sheet-actions .btn { flex: 1; }

.pick-row {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  text-align: left;
  padding: 12px;
  border: 2px solid var(--ink);
  border-radius: var(--r-md);
  background: #fff;
  margin-bottom: 8px;
}
.pick-row.on { background: var(--blue-wash); }
.pick-row.danger { border-color: #b3453a; color: #94322a; }
.pick-main { display: flex; flex-direction: column; gap: 2px; }
.pick-main span { font-size: 12px; color: var(--ink-2); font-weight: 500; }
.pick-row .n { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--blue-press); }

/* ---------- toast / loading ---------- */

#toast {
  position: fixed;
  left: 50%;
  bottom: calc(var(--nav-h) + var(--sab) + 18px);
  transform: translateX(-50%) translateY(10px);
  z-index: 90;
  background: var(--ink);
  color: #fff;
  border-radius: 999px;
  padding: 10px 18px;
  font-size: 14px;
  font-weight: 600;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.18s, transform 0.18s;
  max-width: 86vw;
  text-align: center;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

#loading {
  position: fixed;
  inset: 0;
  z-index: 95;
  background: rgba(246, 244, 238, 0.86);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
}
#loading[hidden] { display: none; }
#loading .hat { width: 54px; height: 54px; animation: bob 1.1s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-10px) rotate(6deg); } }
@media (prefers-reduced-motion: reduce) { #loading .hat { animation: none; } }
#loading .txt { font-weight: 700; }

/* ---------- 空状态 ---------- */

.empty {
  text-align: center;
  padding: 34px 18px;
  border: 2px dashed var(--line);
  border-radius: var(--r-lg);
  background: rgba(255, 255, 255, 0.6);
}
.empty .hat { width: 46px; height: 46px; opacity: 0.9; margin-bottom: 8px; }
.empty p { margin: 4px 0 0; color: var(--ink-2); font-size: 14px; }
.empty h3 { margin: 0; font-size: 16px; font-weight: 800; }

.banner {
  border: 2px solid var(--ink);
  border-radius: var(--r-md);
  background: var(--yellow);
  padding: 10px 12px;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 14px;
  display: flex;
  gap: 8px;
  align-items: flex-start;
}
.banner.info { background: var(--blue-wash); }
.banner.warn { background: #ffe0de; }

.foot-note {
  text-align: center;
  font-size: 12px;
  color: var(--ink-3);
  padding: 18px 0 4px;
}

.preview-item {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  padding: 8px 0;
  border-bottom: 1px dashed var(--line);
}
.preview-item select { width: auto; flex: none; padding: 6px 8px; font-size: 13px; border-width: 1.5px; }
.preview-item input { flex: 1; padding: 7px 9px; font-size: 15px; border-width: 1.5px; }

/* 展开态的课程切换条：窄屏隐藏，宽屏才出现 */
.pane-switch { display: none; }
.switch-chip {
  border: 2px solid var(--ink);
  border-radius: 999px;
  background: #fff;
  padding: 7px 15px;
  font-weight: 700;
  font-size: 14px;
  box-shadow: 2px 2px 0 var(--ink);
}
.switch-chip.on { background: var(--blue); color: #fff; }

/* =====================================================================
   响应式 / 折叠屏
   目标三种形态：
   A 外屏或普通手机   320–479px  单列，收紧留白
   B 内屏竖开         600–819px  内容居中变宽，列表分两栏
   C 内屏横开 / 平板  ≥820px     左侧导航栏 + 双栏，纵向空间让给内容
   折叠展开是纯 CSS 重排，不重新渲染页面，正在输入的内容不会丢。
   ===================================================================== */

/* ---------- A. 窄屏（折叠屏外屏、小手机） ---------- */
@media (max-width: 360px) {
  :root { --pad: 12px; --nav-h: 58px; }
  body { font-size: 15px; }
  .topbar h1 { font-size: 18px; }
  .topbar h1 img { width: 26px; height: 26px; }
  .grade-pill { padding: 4px 10px; font-size: 13px; }
  .card { padding: 12px; border-radius: 14px; }
  .avatar { width: 40px; height: 40px; font-size: 17px; }
  .course-name { font-size: 16px; }
  .date-strip .cur { font-size: 15px; }
  .cal-grid { gap: 3px; }
  .cal-cell { font-size: 14px; border-radius: 8px; }
  .range-bar button { font-size: 13px; padding: 7px 4px; }
  .btn { padding: 10px 13px; font-size: 14px; }
  .bottom-nav button { font-size: 10px; }
}

/* ---------- 中等宽度：内容居中，不再拉满整屏 ---------- */
@media (min-width: 480px) {
  :root { --maxw: 620px; --pad: 20px; }
}

/* ---------- B. 折叠屏内屏竖开：两栏 ---------- */
@media (min-width: 600px) {
  :root { --maxw: 900px; }

  /* 只有列表型页面分栏，表单型页面保持单列 */
  .content.today,
  .content.kp,
  .content.pane {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    column-gap: 20px;
    align-content: start;
  }
  .content.today > *,
  .content.kp > *,
  .content.pane > * { grid-column: 1 / -1; }

  /* 老师卡片、知识点分类、课程页两个区块各占一栏 */
  .content.today > .course-card,
  .content.kp > .card,
  .content.pane > .section { grid-column: auto; align-self: start; }


  /* 宽屏下不让输入框和整块按钮无限拉长 */
  .content:not(.today):not(.kp):not(.pane) .field input,
  .content:not(.today):not(.kp):not(.pane) .field select,
  .content:not(.today):not(.kp):not(.pane) .input-row { max-width: 560px; }
  .btn.block { max-width: 420px; margin-left: auto; margin-right: auto; }
  /* 注意：网格子项一旦有 auto 外边距就不再拉伸，这里必须显式给宽度 */
  .date-strip, .range-bar, .cal-toggle { width: 100%; max-width: 460px; }
  .cal-panel { max-width: 520px; }
  .pin-wrap { max-width: 640px; }
  .seg { max-width: 420px; }
  .content.pane textarea { min-height: 200px; }
  .raw-text { max-height: none; }

  .sheet-mask { align-items: center; }
  .sheet {
    border-radius: 20px;
    border-bottom: 2px solid var(--ink);
    max-height: 84vh;
    padding-bottom: 20px;
    box-shadow: var(--shadow);
  }
}

/* ---------- C. 折叠屏横开 / 平板：侧边导航 ---------- */
@media (min-width: 820px) {
  :root { --maxw: 940px; --rail: 92px; }

  #app {
    padding-bottom: 24px;
    padding-left: calc(var(--rail) + var(--sal));
  }

  .bottom-nav {
    top: 0;
    bottom: 0;
    right: auto;
    width: calc(var(--rail) + var(--sal));
    grid-template-columns: 1fr;
    grid-auto-rows: max-content;
    align-content: start;
    gap: 8px;
    border-top: none;
    border-right: 2px solid var(--ink);
    padding: calc(var(--sat) + 22px) 10px 12px calc(10px + var(--sal));
  }
  .bottom-nav button {
    height: auto;
    padding: 12px 4px;
    border-radius: 14px;
    font-size: 12px;
    gap: 5px;
  }
  .bottom-nav button svg { width: 24px; height: 24px; }
  .bottom-nav button.on { background: var(--blue-wash); color: var(--blue-ink); }

  .pane-switch {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    grid-column: 1 / -1;
    margin-bottom: 16px;
  }

  #toast { left: calc(50% + var(--rail) / 2); bottom: 28px; }
  .sheet-mask { padding-left: var(--rail); }
  .topbar { padding-top: calc(var(--sat) + 12px); }
}

/* ---------- 横开但机身很扁：把纵向空间还给内容 ---------- */
@media (max-height: 560px) and (min-width: 600px) {
  .topbar { padding-top: calc(var(--sat) + 8px); padding-bottom: 10px; }
  .topbar .sub { font-size: 12px; margin-top: 2px; }
  .seg { margin-top: 8px; }
  .content { padding-top: 12px; }
  .content.pane textarea { min-height: 140px; }
  .sheet { max-height: 92vh; }
}

/* ---------- 中间有物理铰链的双屏设备：不要把内容压在折痕上 ---------- */
@media (horizontal-viewport-segments: 2) {
  .content, .topbar > * {
    max-width: env(viewport-segment-width 0 0, var(--maxw));
    margin-left: 0;
  }
  .content.today, .content.kp, .content.pane {
    grid-template-columns: 1fr;
  }
}
@media (spanning: single-fold-vertical) {
  .content, .topbar > * { max-width: env(fold-left, var(--maxw)); margin-left: 0; }
  .content.today, .content.kp, .content.pane { grid-template-columns: 1fr; }
}

/* ---------- 桌面浏览器：别撑满超宽窗口 ---------- */
@media (min-width: 1200px) {
  :root { --maxw: 1000px; }
}

/* 分栏页面里需要整行占满的块 */
.content > .span { grid-column: 1 / -1; }

</style>
</head>
<body>

<div id="app">
  <header class="topbar" id="topbar"></header>
  <main id="view"></main>
</div>

<nav class="bottom-nav" id="nav" aria-label="主导航"></nav>

<div class="sheet-mask" id="sheet-mask" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>

<div id="loading" hidden>
  <svg class="hat" viewBox="0 0 48 48" fill="none" stroke="#141414" stroke-width="2.4" stroke-linejoin="round">
    <path d="M14 30V13c0-2 1.6-3 4-3h12c2.4 0 4 1 4 3v17" fill="#02a4dc"/>
    <path d="M14 17h20" stroke="#fff" stroke-width="5"/>
    <path d="M14 17h20"/><path d="M14 23h20"/>
    <ellipse cx="24" cy="31" rx="17" ry="5" fill="#02a4dc"/>
    <ellipse cx="24" cy="31" rx="17" ry="5"/>
  </svg>
  <div class="txt">AI 正在分析…</div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
/* version.js — 全项目唯一的版本号出处。
   改这里，然后同步改 service-worker.js 顶部的 VERSION（构建脚本会校验两者一致）。 */

window.APP = {
  name: 'HM',
  fullName: 'HM · 家长端作业管家',
  version: '1.5.2',
  buildDate: '2026-09-13'
};

;
/* db.js — 本地存储层
   主存储 IndexedDB；当浏览器在 file:// 或隐私模式下禁用 IndexedDB 时，
   自动降级到 localStorage，再降级到内存（并提示用户及时导出 JSON）。
   对上层只暴露 getAll / get / put / bulkPut / remove / clear。 */

window.DB = (function () {
  var DB_NAME = 'xiaotao-homework';
  var DB_VER = 1;
  var STORES = ['grades', 'courses', 'dailyRecords', 'mathKnowledge', 'wordRecords', 'settings'];

  var idb = null;
  var mode = 'idb'; // idb | local | memory
  var mem = {};
  STORES.forEach(function (s) { mem[s] = {}; });

  function lsKey(store) { return 'xt.' + store; }

  function lsRead(store) {
    try {
      var raw = localStorage.getItem(lsKey(store));
      return raw ? JSON.parse(raw) : {};
    } catch (e) { return {}; }
  }

  function lsWrite(store, obj) {
    try {
      localStorage.setItem(lsKey(store), JSON.stringify(obj));
      return true;
    } catch (e) {
      // 配额满或被禁用 → 退到内存
      mode = 'memory';
      return false;
    }
  }

  function openIDB() {
    return new Promise(function (resolve, reject) {
      var req;
      try {
        if (!window.indexedDB) return reject(new Error('no indexedDB'));
        req = indexedDB.open(DB_NAME, DB_VER);
      } catch (e) { return reject(e); }

      var timer = setTimeout(function () { reject(new Error('idb timeout')); }, 3000);

      req.onupgradeneeded = function (ev) {
        var d = ev.target.result;
        STORES.forEach(function (s) {
          if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id' });
        });
      };
      req.onsuccess = function () { clearTimeout(timer); resolve(req.result); };
      req.onerror = function () { clearTimeout(timer); reject(req.error || new Error('idb error')); };
      req.onblocked = function () { clearTimeout(timer); reject(new Error('idb blocked')); };
    });
  }

  function tx(store, write) {
    var t = idb.transaction(store, write ? 'readwrite' : 'readonly');
    return t.objectStore(store);
  }

  function wrap(request) {
    return new Promise(function (resolve, reject) {
      request.onsuccess = function () { resolve(request.result); };
      request.onerror = function () { reject(request.error); };
    });
  }

  /* ---------- 对外 API ---------- */

  async function init() {
    try {
      idb = await openIDB();
      mode = 'idb';
      // 冒烟测试：某些环境 open 成功但读写失败
      await getAll('settings');
    } catch (e) {
      idb = null;
      try {
        localStorage.setItem('xt.probe', '1');
        localStorage.removeItem('xt.probe');
        mode = 'local';
      } catch (e2) {
        mode = 'memory';
      }
    }
    return mode;
  }

  async function getAll(store) {
    if (mode === 'idb') {
      try { return await wrap(tx(store, false).getAll()); }
      catch (e) { mode = 'local'; }
    }
    var obj = mode === 'local' ? lsRead(store) : mem[store];
    return Object.keys(obj).map(function (k) { return obj[k]; });
  }

  async function get(store, id) {
    if (mode === 'idb') {
      try { return (await wrap(tx(store, false).get(id))) || null; }
      catch (e) { mode = 'local'; }
    }
    var obj = mode === 'local' ? lsRead(store) : mem[store];
    return obj[id] || null;
  }

  async function put(store, value) {
    if (mode === 'idb') {
      try { await wrap(tx(store, true).put(value)); return value; }
      catch (e) { mode = 'local'; }
    }
    if (mode === 'local') {
      var obj = lsRead(store);
      obj[value.id] = value;
      if (lsWrite(store, obj)) return value;
    }
    mem[store][value.id] = value;
    return value;
  }

  async function bulkPut(store, values) {
    if (!values || !values.length) return;
    if (mode === 'idb') {
      try {
        var t = idb.transaction(store, 'readwrite');
        var os = t.objectStore(store);
        values.forEach(function (v) { os.put(v); });
        await new Promise(function (res, rej) {
          t.oncomplete = res;
          t.onerror = function () { rej(t.error); };
          t.onabort = function () { rej(t.error); };
        });
        return;
      } catch (e) { mode = 'local'; }
    }
    for (var i = 0; i < values.length; i++) await put(store, values[i]);
  }

  async function remove(store, id) {
    if (mode === 'idb') {
      try { await wrap(tx(store, true).delete(id)); return; }
      catch (e) { mode = 'local'; }
    }
    if (mode === 'local') {
      var obj = lsRead(store);
      delete obj[id];
      if (lsWrite(store, obj)) return;
    }
    delete mem[store][id];
  }

  async function clear(store) {
    if (mode === 'idb') {
      try { await wrap(tx(store, true).clear()); return; }
      catch (e) { mode = 'local'; }
    }
    if (mode === 'local') { if (lsWrite(store, {})) return; }
    mem[store] = {};
  }

  async function clearAll() {
    for (var i = 0; i < STORES.length; i++) await clear(STORES[i]);
  }

  return {
    STORES: STORES,
    init: init,
    getAll: getAll,
    get: get,
    put: put,
    bulkPut: bulkPut,
    remove: remove,
    clear: clear,
    clearAll: clearAll,
    get mode() { return mode; }
  };
})();

;
/* store.js — 业务数据层
   数据关系：学生 → 年级 → 课程(含老师) → 每日记录
   所有内容都绑定 date / gradeId / courseId */

window.Store = (function () {
  var SCHEMA_VERSION = 1;

  var COURSE_TYPES = [
    { key: 'chinese', label: '语文', icon: '语' },
    { key: 'math', label: '数学', icon: '数' },
    { key: 'english', label: '常规英语', icon: 'A' },
    { key: 'pbl', label: 'PBL英语', icon: 'P' },
    { key: 'other', label: '其他', icon: '·' }
  ];

  /* 2026-09-10：DeepSeek V4.1-Flash 正式版上线，模型名统一成 deepseek-flash，
     原生支持图片，所以文字和图片用同一个模型就够了。
     上一代 deepseek-v4-flash / deepseek-v4-flash-vision-exp 已下线，
     官方暂时把这两个名字转发到 V4.1-Flash，但不保证一直转发，所以这里直接迁移掉。 */
  var DEFAULT_ENDPOINT = 'https://api.deepseek.com/chat/completions';
  var DEFAULT_MODEL = 'deepseek-flash';
  var DEFAULT_VISION_MODEL = 'deepseek-flash';

  /* 这些是历史默认值，遇到就升级；用户自己填的别的名字一律不动 */
  var LEGACY_MODELS = ['deepseek-chat', 'deepseek-v4-flash', 'deepseek-v4-flash-vision-exp'];

  var settings = {
    apiKey: '',
    endpoint: DEFAULT_ENDPOINT,
    model: DEFAULT_MODEL,
    visionModel: DEFAULT_VISION_MODEL,
    visionEndpoint: '',
    keepImages: false,
    currentGradeId: '',
    modelsMigrated: ''
  };

  /* ---------- 工具 ---------- */

  function uid(prefix) {
    return (prefix || 'x') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  function toKey(d) {
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  function fromKey(key) {
    var p = key.split('-');
    return new Date(+p[0], +p[1] - 1, +p[2]);
  }

  function todayKey() { return toKey(new Date()); }

  function shiftKey(key, days) {
    var d = fromKey(key);
    d.setDate(d.getDate() + days);
    return toKey(d);
  }

  var WEEK = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];

  function humanDate(key) {
    var d = fromKey(key);
    var s = (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + WEEK[d.getDay()];
    if (key === todayKey()) s = '今天 · ' + s;
    else if (key === shiftKey(todayKey(), -1)) s = '昨天 · ' + s;
    else if (key === shiftKey(todayKey(), 1)) s = '明天 · ' + s;
    return s;
  }

  function shortDate(key) {
    var d = fromKey(key);
    return (d.getMonth() + 1) + '/' + d.getDate();
  }

  function typeLabel(t) {
    var f = COURSE_TYPES.filter(function (x) { return x.key === t; })[0];
    return f ? f.label : '其他';
  }

  function typeIcon(t) {
    var f = COURSE_TYPES.filter(function (x) { return x.key === t; })[0];
    return f ? f.icon : '·';
  }

  /* ---------- 设置 ---------- */

  async function loadSettings() {
    var rows = await DB.getAll('settings');
    rows.forEach(function (r) {
      if (r.id in settings) settings[r.id] = r.value;
    });
    // API Key 单独放 localStorage，保证只留在本机、且绝不进入 JSON 导出
    try {
      var k = localStorage.getItem('xt.apiKey');
      if (k) settings.apiKey = k;
    } catch (e) { /* ignore */ }
    return settings;
  }

  async function setSetting(key, value) {
    settings[key] = value;
    if (key === 'apiKey') {
      try {
        if (value) localStorage.setItem('xt.apiKey', value);
        else localStorage.removeItem('xt.apiKey');
      } catch (e) { /* ignore */ }
      return;
    }
    await DB.put('settings', { id: key, value: value });
  }

  /* ---------- 年级 ---------- */

  async function getGrades() {
    var g = await DB.getAll('grades');
    return g.sort(function (a, b) { return (a.createdAt || 0) - (b.createdAt || 0); });
  }

  async function currentGrade() {
    var grades = await getGrades();
    if (!grades.length) return null;
    var cur = grades.filter(function (g) { return g.id === settings.currentGradeId; })[0];
    if (cur) return cur;
    cur = grades.filter(function (g) { return g.isCurrent; })[0] || grades[grades.length - 1];
    await setSetting('currentGradeId', cur.id);
    return cur;
  }

  async function addGrade(name) {
    var g = { id: uid('g'), name: name, isCurrent: false, createdAt: Date.now(), archived: false };
    await DB.put('grades', g);
    return g;
  }

  async function setCurrentGrade(id) {
    var grades = await getGrades();
    for (var i = 0; i < grades.length; i++) {
      grades[i].isCurrent = grades[i].id === id;
      await DB.put('grades', grades[i]);
    }
    await setSetting('currentGradeId', id);
  }

  async function renameGrade(id, name) {
    var g = await DB.get('grades', id);
    if (!g) return;
    g.name = name;
    await DB.put('grades', g);
  }

  async function archiveGrade(id, archived) {
    var g = await DB.get('grades', id);
    if (!g) return;
    g.archived = !!archived;
    await DB.put('grades', g);
  }

  /* ---------- 课程 / 老师 ---------- */

  async function getCourses(gradeId, includeArchived) {
    var all = await DB.getAll('courses');
    return all
      .filter(function (c) {
        if (gradeId && c.gradeId !== gradeId) return false;
        if (!includeArchived && c.archived) return false;
        return true;
      })
      .sort(function (a, b) { return (a.sortOrder || 0) - (b.sortOrder || 0); });
  }

  async function saveCourse(data) {
    var c;
    if (data.id) {
      c = await DB.get('courses', data.id);
      if (!c) c = { id: data.id };
    } else {
      var sibs = await getCourses(data.gradeId, true);
      c = { id: uid('c'), sortOrder: sibs.length, archived: false, createdAt: Date.now() };
    }
    ['gradeId', 'name', 'teacherName', 'teacherAvatar', 'type'].forEach(function (k) {
      if (k in data) c[k] = data[k];
    });
    await DB.put('courses', c);
    return c;
  }

  async function archiveCourse(id, archived) {
    var c = await DB.get('courses', id);
    if (!c) return;
    c.archived = !!archived;
    await DB.put('courses', c);
  }

  async function moveCourse(id, dir) {
    var c = await DB.get('courses', id);
    if (!c) return;
    var list = await getCourses(c.gradeId, true);
    var i = list.findIndex(function (x) { return x.id === id; });
    var j = i + dir;
    if (i < 0 || j < 0 || j >= list.length) return;
    var tmp = list[i];
    list[i] = list[j];
    list[j] = tmp;
    for (var k = 0; k < list.length; k++) {
      list[k].sortOrder = k;
      await DB.put('courses', list[k]);
    }
  }

  /* ---------- 每日记录 ---------- */

  function recordId(date, courseId) { return date + '__' + courseId; }

  async function getRecord(date, courseId) {
    return await DB.get('dailyRecords', recordId(date, courseId));
  }

  async function ensureRecord(date, course) {
    var r = await getRecord(date, course.id);
    if (r) return r;
    return {
      id: recordId(date, course.id),
      date: date,
      gradeId: course.gradeId,
      courseId: course.id,

  async function saveRecord(rec) {

  async function getRecordsInMonth(year, month, gradeId) {

    return all.filter(function (r) {
      return r.date.indexOf(prefix) === 0 && (!gradeId || r.gradeId === gradeId);

  /* ---------- 阶段性作业（带截止日期，跨多天） ----------

  async function getSpanTasks(gradeId, opts) {
    opts = opts || {};

    var out = [];
    all.forEach(function (r) {

      (r.tasks || []).forEach(function (t) {
        if (!t.due) return;
        if (opts.onDate && (r.date > opts.onDate || t.due < opts.onDate)) return;
        if (opts.courseId && r.courseId !== opts.courseId) return;
        if (opts.unfinishedOnly && t.completed) return;
        out.push({ task: t, record: r, date: r.date, courseId: r.courseId, due: t.due });

    out.sort(function (a, b) {
      if (!!a.task.completed !== !!b.task.completed) return a.task.completed ? 1 : -1;
      if (a.due !== b.due) return a.due < b.due ? -1 : 1;
      return a.date < b.date ? -1 : 1;
    });
    return out;
  }

  /* 从 a 到 b 相差几天（正数表示 b 在后面） */
  function daysBetween(a, b) {

  }

  /* 距离截止还有几天：正数还剩、0 今天到期、负数已过期 */
  function daysLeft(due) { return daysBetween(todayKey(), due); }

  function dueLabel(due) {
    var n = daysLeft(due);
    if (n > 1) return '还有 ' + n + ' 天';
    if (n === 1) return '明天截止';
    if (n === 0) return '今天截止';
    return '已过期 ' + (-n) + ' 天';
  }

  /* ---------- 英语 / PBL 提词结果 ---------- */

  async function saveWordRecord(entry) {

    return entry;

  /* 按时间区间取提词结果，供「知识库 → 英语」汇总用 */
  async function getWordRecordsRange(from, to, gradeId) {
    var all = await DB.getAll('wordRecords');
    return all
      .filter(function (e) {
        if (from && e.date < from) return false;
        if (to && e.date > to) return false;
        if (gradeId && e.gradeId && e.gradeId !== gradeId) return false;
        return true;
      })
      .sort(function (a, b) { return a.date < b.date ? -1 : 1; });
  }

  /* 单词去重汇总：同一个词只留一条，记首次出现日期和出现次数。
     大小写不敏感（Apple 和 apple 算同一个），展示时统一小写，I 除外。 */
  function aggregateWords(records) {
    var map = {};
    var order = [];
    (records || []).forEach(function (r) {
      (r.words || []).forEach(function (raw) {
        var w = normalizeWord(raw);
        if (!w) return;
        var key = w.toLowerCase();
        if (!map[key]) {
          map[key] = { word: w, firstSeen: r.date, lastSeen: r.date, count: 0 };
          order.push(key);
        }
        var it = map[key];
        it.count += 1;
        if (r.date < it.firstSeen) it.firstSeen = r.date;
        if (r.date > it.lastSeen) it.lastSeen = r.date;
      });
    });
    return order.map(function (k) { return map[k]; }).sort(function (a, b) {
      if (a.firstSeen !== b.firstSeen) return a.firstSeen < b.firstSeen ? -1 : 1;
      return a.word.localeCompare(b.word);

  }

  /* 把 AI 返回的内容拆成单个单词：good morning → good, morning。

        var w = normalizeWord(piece);
        if (!w) return;
        var k = w.toLowerCase();
        if (seen[k]) return;
        seen[k] = 1;
        out.push(w);
      });
    });
    return out;
  }

  function normalizeWord(raw) {
    var w = String(raw || '').trim().replace(/^['\-]+|['\-]+$/g, '');
    if (!w || !/[A-Za-z]/.test(w)) return '';
    return w === 'I' ? 'I' : w.toLowerCase();
  }

  async function getWordRecords(date, courseId) {
    var all = await DB.getAll('wordRecords');
    return all.filter(function (e) {
      return (!date || e.date === date) && (!courseId || e.courseId === courseId);
    }).sort(function (a, b) { return (a.createdAt || 0) - (b.createdAt || 0); });
  }

  async function deleteWordRecord(id) { await DB.remove('wordRecords', id); }

  /* ---------- 知识点归类（纯本地规则，不调用 AI） ---------- */

  var CATEGORY_RULES = [
    { name: '数与运算', words: ['加', '减', '乘', '除', '数', '算', '凑十', '进位', '退位', '口算', '竖式', '倍', '分解', '组成', '大小比较'] },
    { name: '图形与几何', words: ['图形', '几何', '长方', '正方', '三角', '圆', '角', '立体', '平面', '对称', '方位', '位置'] },
    { name: '量与计量', words: ['长度', '厘米', '米', '重量', '克', '千克', '时间', '钟表', '几时', '人民币', '元角分', '测量'] },
    { name: '应用与解决问题', words: ['应用', '解决问题', '看图列式', '数量关系', '实际问题', '两步'] },
    { name: '统计与规律', words: ['统计', '规律', '分类', '整理', '数据'] }
  ];

  function categorize(point) {
    for (var i = 0; i < CATEGORY_RULES.length; i++) {
      var rule = CATEGORY_RULES[i];
      for (var j = 0; j < rule.words.length; j++) {
        if (point.indexOf(rule.words[j]) >= 0) return rule.name;
      }
    }
    return '其他';
  }

  /* 把区间内的知识点聚合成 分类 → [{name, firstSeen, lastSeen, count}] */
  function aggregate(entries) {
    var map = {};
    entries.forEach(function (e) {
      var pts = (e.coreKnowledge || []).concat(e.skills || []);
      pts.forEach(function (p) {
        var name = String(p).trim();
        if (!name) return;
        if (!map[name]) map[name] = { name: name, count: 0, firstSeen: e.date, lastSeen: e.date };
        map[name].count++;
        if (e.date < map[name].firstSeen) map[name].firstSeen = e.date;
        if (e.date > map[name].lastSeen) map[name].lastSeen = e.date;
      });
    });

    var byCat = {};
    Object.keys(map).forEach(function (name) {
      var cat = categorize(name);
      (byCat[cat] = byCat[cat] || []).push(map[name]);
    });

    var order = ['数与运算', '图形与几何', '量与计量', '应用与解决问题', '统计与规律', '其他'];
    return order
      .filter(function (c) { return byCat[c]; })
      .map(function (c) {
        byCat[c].sort(function (a, b) {
          if (a.firstSeen !== b.firstSeen) return a.firstSeen < b.firstSeen ? -1 : 1;
          return b.count - a.count;
        });
        return { name: c, items: byCat[c] };
      });
  }

  /* ---------- 首次启动：只建年级，不写任何假作业数据 ---------- */

  /* 老版本装过的设备：把停用的 deepseek-chat 换成在售模型，

  async function migrateModelNames() {

    await setSetting('modelsMigrated', 'v4.1');

  async function bootstrap() {

      await DB.put('grades', g);
      await setSetting('currentGradeId', g.id);

  return {

    categorize: categorize,
    aggregate: aggregate,

/* ai.js — AI 抽象层（默认 DeepSeek，兼容任何 OpenAI 格式接口）
   规则：
   - 只有用户明确点击 AI 按钮时才会调用这里的函数
   - 文字整理用 model（默认 deepseek-v4-flash）
   - 图片分析用 visionModel（默认 deepseek-v4-flash-vision-exp，DeepSeek 目前唯一收图片的模型）
     图片按 OpenAI 兼容格式的 image_url content block 传 Base64 data URL
   - 一律要求返回 JSON，前端做兜底解析，绝不因为一次失败而崩页面 */

window.AI = (function () {
  var TIMEOUT = 60000;

  function cfg() { return Store.settings; }

  function hasKey() { return !!(cfg().apiKey || '').trim(); }

  function visionReady() {
    var m = (cfg().visionModel || '').trim();
    return !!m;
  }

  function endpointFor(kind) {
    var c = cfg();
    if (kind === 'vision' && (c.visionEndpoint || '').trim()) return c.visionEndpoint.trim();
    return (c.endpoint || '').trim() || Store.DEFAULT_ENDPOINT;
  }

  /* ---------- 底层请求 ---------- */

  async function chat(messages, opts) {
    opts = opts || {};
    var c = cfg();

    if (!navigator.onLine) throw new AIError('当前离线，AI 功能需要网络。', 'offline');
    if (!hasKey()) throw new AIError('还没有填写 API Key，请到「设置」里填写。', 'nokey');

    var kind = opts.kind || 'text';
    var model = kind === 'vision'
      ? (c.visionModel || '').trim()
      : ((c.model || '').trim() || Store.DEFAULT_MODEL);
    if (kind === 'vision' && !model) {
      throw new AIError('还没有配置图片模型。到「设置」把图片模型填成 ' +
        Store.DEFAULT_VISION_MODEL + ' 就能用。', 'novision');
    }

    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, opts.timeout || TIMEOUT);

    var body = {
      model: model,
      messages: messages,
      temperature: opts.temperature == null ? 0.2 : opts.temperature,
      stream: false

    if (opts.jsonMode !== false && kind === 'text') {
      body.response_format = { type: 'json_object' };
    }

    var res;
    try {
      res = await fetch(endpointFor(kind), {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: 'Bearer ' + c.apiKey.trim()

        body: JSON.stringify(body),
        signal: ctrl.signal
      });
    } catch (e) {
      clearTimeout(timer);
      if (e.name === 'AbortError') throw new AIError('AI 请求超时，请稍后再试。', 'timeout');
      throw new AIError('网络请求失败。如果这是本地 html 文件，浏览器可能拦截了跨域请求，建议改用 GitHub Pages 版本。', 'network');
    }
    clearTimeout(timer);

    if (!res.ok) {
      var detail = '';
      try {
        var errJson = await res.json();
        detail = (errJson.error && (errJson.error.message || errJson.error.type)) || '';
      } catch (e) { /* ignore */ }
      var msg = 'AI 接口返回错误 ' + res.status;

          Store.DEFAULT_VISION_MODEL + ' 再试。', 'novision');

      if (res.status === 401) msg = 'API Key 无效或已过期，请到设置里检查。';
      else if (res.status === 402) msg = '账户余额不足，请到 DeepSeek 平台充值。';
      else if (res.status === 429) msg = '请求太频繁，请过一会再试。';
      else if (detail) msg += '：' + detail;

    var data = await res.json();
    var text = '';
    try {

      if (Array.isArray(text)) {

    if (!text || !String(text).trim()) throw new AIError('AI 返回了空结果，请重试一次。', 'empty');

  /* ---------- 图片压缩 ---------- */

  function compressImage(file, maxSide, quality) {
    maxSide = maxSide || 1024;
    quality = quality || 0.82;
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onerror = function () { reject(new Error('读取图片失败')); };
      reader.onload = function () {
        var img = new Image();
        img.onerror = function () { reject(new Error('图片格式不支持')); };
        img.onload = function () {
          var w = img.naturalWidth, h = img.naturalHeight;
          var scale = Math.min(1, maxSide / Math.max(w, h));
          var cw = Math.max(1, Math.round(w * scale));
          var ch = Math.max(1, Math.round(h * scale));
          var cv = document.createElement('canvas');
          cv.width = cw; cv.height = ch;
          var ctx = cv.getContext('2d');
          ctx.fillStyle = '#fff';
          ctx.fillRect(0, 0, cw, ch);
          ctx.drawImage(img, 0, 0, cw, ch);
          resolve(cv.toDataURL('image/jpeg', quality));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function visionMessages(systemText, userText, dataUrls) {
    // 官方示例是 text 块在前、image_url 块在后，这里保持一致
    var content = [{ type: 'text', text: userText }];
    (dataUrls || []).forEach(function (u) {
      content.push({ type: 'image_url', image_url: { url: u } });
    });
    return [
      { role: 'system', content: systemText },
      { role: 'user', content: content }
    ];
  }

  /* ---------- 功能一：老师原文 → 作业清单 ---------- */

  var TASK_SYSTEM =
    '你是小学作业信息整理助手，只做“拆分”，不做“摘要”。' +
    '把家长从微信群复制的老师原文，拆成一条条可以勾选执行的具体任务。\n' +
    '硬性规则：\n' +
    '1. 必须保留老师原文里的页码、题号、册子名称、次数、日期等所有细节。\n' +
    '2. 绝对不能合并成“完成数学作业”这类笼统说法，也绝对不能增加老师没有布置的任务。\n' +
    '3. 一件事一条。原文里如果是“P15第1-4题”，就写“数学书 P15 第1-4题”。\n' +
    '4. type 三选一：student（孩子自己做）、parent（家长要做，如签字、打印、报名）、reminder（提醒或要带的东西）。\n' +
    '5. 只输出 JSON，不要解释，不要 markdown。格式：{"tasks":[{"text":"...","type":"student"}]}';

  async function parseHomework(rawText, courseType) {
    var extra = '';
    if (courseType === 'chinese') {
      extra = '这是语文作业，请特别留意：朗读、背诵、写字、生字、词语、预习、家长签字、需要携带的物品。';
    } else if (courseType === 'math') {
      extra = '这是数学作业，请特别留意：书本页码题号、口算练习、订正错题、家长签字。';
    } else if (courseType === 'english' || courseType === 'pbl') {
      extra = '这是英语作业，请特别留意：跟读、听录音、默写单词、背诵句子、需要上传的音视频。';
    }
    var text = await chat([
      { role: 'system', content: TASK_SYSTEM },
      { role: 'user', content: (extra ? extra + '\n\n' : '') + '老师原文：\n' + rawText }
    ], { kind: 'text' });

    var data = parseJSON(text);
    var tasks = (data.tasks || data.list || []).map(function (t) {
      var type = (t && t.type) || 'student';
      if (['student', 'parent', 'reminder'].indexOf(type) < 0) type = 'student';
      var txt = (typeof t === 'string' ? t : (t.text || t.title || '')).trim();
      return { text: txt, type: type };
    }).filter(function (t) { return t.text; });

    if (!tasks.length) throw new AIError('AI 没有识别出任务，请检查原文内容。', 'empty');
    return tasks;
  }

  /* ---------- 功能二：数学作业图片 → 知识点 ---------- */

  var MATH_SYSTEM =
    '你是小学数学知识点分析助手。用户上传的是孩子的数学作业、练习或试卷照片。\n' +
    '你的任务不是给答案，而是分析这些题目考查了哪些数学知识点。\n' +
    '要求：\n' +
    '1. 知识点必须具体，例如“20以内进位加法”“凑十法”“看图列式”，' +
    '不要只写“加法”“减法”“应用题”这种过粗的说法。\n' +
    '2. coreKnowledge 写核心知识点（3-8条）；skills 写更细的能力点，' +
    '例如“理解凑十的过程”“根据图意判断用加还是用减”“识别已知量和未知量”。\n' +
    '3. 如果图片看不清或不是数学作业，返回空数组。\n' +
    '4. 只输出 JSON：{"coreKnowledge":["..."],"skills":["..."]}';

  async function analyzeMathImages(dataUrls) {
    var text = await chat(
      visionMessages(MATH_SYSTEM, '请分析这些数学作业图片涉及的知识点，只返回 JSON。', dataUrls),
      { kind: 'vision' }
    );
    var data = parseJSON(text);
    return {
      coreKnowledge: asStringList(data.coreKnowledge || data.core || data.knowledge),
      skills: asStringList(data.skills || data.abilities)
    };
  }

  /* ---------- 功能三：英语图片 → 单词 ---------- */

  var ENGLISH_SYSTEM =
    '你是英语单词提取助手。用户上传的是小学英语课本或默写单词表的照片。\n' +
    '只提取图片中出现的英文单词，用于家长复制到背单词 App。\n' +
    '要求：\n' +
    '1. 只输出单个单词，不要词组、不要短语、不要句子。\n' +
    '   遇到词组必须拆成单词：good morning 输出 ["good","morning"]，' +
    'in the classroom 输出 ["in","the","classroom"]。\n' +
    '2. 只输出英文，不要中文翻译、不要音标、不要例句、不要解释。\n' +
    '3. 保持图片里的原形，不要自行变形或补充图片里没有的词。\n' +
    '4. 去掉重复。\n' +
    '5. 只输出 JSON：{"words":["apple","teacher"]}';

  async function extractWords(dataUrls) {
    var text = await chat(
      visionMessages(ENGLISH_SYSTEM, '请提取图片中的英文单词，只返回 JSON。', dataUrls),
      { kind: 'vision' }
    );
    var data = parseJSON(text);
    // AI 偶尔还是会吐词组，这里本地再拆一次，保证清单里只有单词
    return { words: Store.splitWords(asStringList(data.words || data.word || data.list)) };
  }

  /* ---------- 功能四：PBL 图片 → 单词 + 核心表达 ---------- */

  var PBL_SYSTEM =
    '你是 PBL 英语学习材料分析助手。用户上传的是 PBL 课程的学习材料照片。\n' +
    '输出两部分：\n' +
    '1. words：材料中出现的英文单词，只要单个单词，词组要拆开（good morning → good, morning），去重。\n' +
    '2. expressions：材料中出现的核心句型或表达，保持完整短句，例如 "This is my family." "It can grow."\n' +
    '不要翻译，不要解释，不要自行编造材料里没有的内容。\n' +
    '只输出 JSON：{"words":["plant"],"expressions":["It can grow."]}';

  async function analyzePBL(dataUrls) {
    var text = await chat(
      visionMessages(PBL_SYSTEM, '请提取单词和核心表达，只返回 JSON。', dataUrls),
      { kind: 'vision' }
    );
    var data = parseJSON(text);
    return {
      words: Store.splitWords(asStringList(data.words)),
      expressions: asStringList(data.expressions || data.keyExpressions)
    };
  }

  /* ---------- 连接测试 ---------- */

  async function testConnection() {
    var text = await chat([
      { role: 'system', content: '只输出 JSON。' },
      { role: 'user', content: '返回 {"ok":true}' }
    ], { kind: 'text', timeout: 20000 });
    parseJSON(text);
    return true;
  }

  async function testVision(dataUrl) {
    var text = await chat(
      visionMessages('只输出 JSON。', '这张图片里有内容吗？返回 {"ok":true}', [dataUrl]),
      { kind: 'vision', timeout: 30000 }
    );
    parseJSON(text);
    return true;
  }

  return {
    AIError: AIError,
    hasKey: hasKey,
    visionReady: visionReady,
    parseJSON: parseJSON,
    compressImage: compressImage,
    parseHomework: parseHomework,
    analyzeMathImages: analyzeMathImages,
    extractWords: extractWords,
    analyzePBL: analyzePBL,
    testConnection: testConnection,
    testVision: testVision
  };
})();

/* ui.js — 通用 UI 零件：toast / loading / 底部抽屉 / 确认框 / 复制
   全站不使用 alert()。 */

window.UI = (function () {
  var toastEl, loadingEl, loadingTxt, maskEl, sheetEl;
  var toastTimer = null;

  function mount() {
    toastEl = document.getElementById('toast');
    loadingEl = document.getElementById('loading');
    loadingTxt = loadingEl.querySelector('.txt');
    maskEl = document.getElementById('sheet-mask');
    sheetEl = document.getElementById('sheet');

    maskEl.addEventListener('click', function (e) {
      if (e.target === maskEl) closeSheet();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !maskEl.hidden) closeSheet();
    });
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function toast(msg) {
    if (!toastEl) return;
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2200);
  }

  function loading(on, text) {
    if (!loadingEl) return;
    loadingTxt.textContent = text || 'AI 正在分析…';
    loadingEl.hidden = !on;
  }

  /* ---------- 底部抽屉 ---------- */

  var sheetCloseHandler = null;

  function openSheet(html, onMount) {
    sheetEl.innerHTML = html;
    maskEl.hidden = false;
    document.documentElement.classList.add('sheet-open');
    if (onMount) onMount(sheetEl);
    var firstInput = sheetEl.querySelector('input,textarea,select');
    if (firstInput && firstInput.dataset.autofocus === '1') {
      // 用 rAF 而不是定时器，并且如果用户已经点进别的输入框就不抢焦点
      requestAnimationFrame(function () {
        if (!sheetEl.contains(firstInput)) return;
        var a = document.activeElement;
        if (a && a !== document.body && a !== firstInput && sheetEl.contains(a)) return;
        firstInput.focus();
      });
    }
  }

  function closeSheet() {
    maskEl.hidden = true;
    sheetEl.innerHTML = '';
    document.documentElement.classList.remove('sheet-open');
    document.body.style.overflow = ''; // 清掉老版本可能残留的内联锁
    if (sheetCloseHandler) { var h = sheetCloseHandler; sheetCloseHandler = null; h(); }
  }

  /* ---------- 长按 ---------- */

  var lastLongPress = 0;

  /* 长按 500ms 触发；触摸滑动会取消；电脑上右键等价 */
  function onLongPress(el, fn) {
    var timer = null;
    var moved = false;

    function fire(e) {
      timer = null;
      lastLongPress = Date.now();
      if (navigator.vibrate) { try { navigator.vibrate(12); } catch (err) { /* 忽略 */ } }
      fn(e);
    }
    function start(e) {
      moved = false;
      cancel();
      timer = setTimeout(function () { if (!moved) fire(e); }, 500);
    }
    function cancel() { if (timer) { clearTimeout(timer); timer = null; } }
    function move() { moved = true; cancel(); }

    el.addEventListener('touchstart', start, { passive: true });
    el.addEventListener('touchmove', move, { passive: true });
    el.addEventListener('touchend', cancel);
    el.addEventListener('touchcancel', cancel);
    el.addEventListener('mousedown', start);
    el.addEventListener('mouseup', cancel);
    el.addEventListener('mouseleave', cancel);
    el.addEventListener('contextmenu', function (e) { e.preventDefault(); cancel(); fire(e); });
  }

  /* 长按之后浏览器还会补一个 click，点击处理里用这个挡掉 */
  function justLongPressed() { return Date.now() - lastLongPress < 700; }

  /* 一组操作的选择弹层 */
  function actions(opts) {
    return new Promise(function (resolve) {
      var settled = false;
      var html = '<h2>' + esc(opts.title || '选择操作') + '</h2>' +
        (opts.body ? '<p class="sheet-sub">' + esc(opts.body) + '</p>' : '') +
        opts.items.map(function (it, i) {
          return '<button class="pick-row' + (it.danger ? ' danger' : '') + '" data-i="' + i + '">' +
            '<span class="pick-main"><b>' + esc(it.label) + '</b>' +
            (it.hint ? '<span>' + esc(it.hint) + '</span>' : '') + '</span></button>';
        }).join('') +
        '<div class="sheet-actions"><button class="btn ghost" data-act="cancel">取消</button></div>';

      openSheet(html, function (root) {
        root.querySelectorAll('[data-i]').forEach(function (b) {
          b.onclick = function () {
            settled = true;
            closeSheet();
            resolve(opts.items[+b.dataset.i].value);
          };
        });
        root.querySelector('[data-act="cancel"]').onclick = closeSheet;
        onSheetClose(function () { if (!settled) resolve(null); });
      });
    });
  }

  function onSheetClose(fn) { sheetCloseHandler = fn; }

  /* 兜底：只要没有抽屉在开着，就绝不允许背景滚动被锁住 */
  function unlockScrollIfIdle() {
    if (!maskEl || !maskEl.hidden) return;
    document.documentElement.classList.remove('sheet-open');
    if (document.body.style.overflow) document.body.style.overflow = '';
  }

  function confirm(opts) {
    return new Promise(function (resolve) {
      var html =
        '<h2>' + esc(opts.title) + '</h2>' +
        (opts.body ? '<p class="sheet-sub">' + opts.body + '</p>' : '') +
        '<div class="sheet-actions">' +
        '<button class="btn ghost" data-act="no">' + esc(opts.cancelText || '取消') + '</button>' +
        '<button class="btn ' + (opts.danger ? 'danger' : 'primary') + '" data-act="yes">' +
        esc(opts.okText || '确定') + '</button>' +
        '</div>';
      var done = false;
      onSheetClose(function () { if (!done) resolve(false); });
      openSheet(html, function (root) {
        root.querySelector('[data-act="no"]').onclick = function () { done = true; closeSheet(); resolve(false); };
        root.querySelector('[data-act="yes"]').onclick = function () { done = true; closeSheet(); resolve(true); };
      });
    });
  }

  function prompt(opts) {
    return new Promise(function (resolve) {
      var html =
        '<h2>' + esc(opts.title) + '</h2>' +
        (opts.body ? '<p class="sheet-sub">' + esc(opts.body) + '</p>' : '') +
        '<div class="field"><input type="text" data-autofocus="1" id="prompt-input" value="' +
        esc(opts.value || '') + '" placeholder="' + esc(opts.placeholder || '') + '"></div>' +
        '<div class="sheet-actions">' +
        '<button class="btn ghost" data-act="no">取消</button>' +
        '<button class="btn primary" data-act="yes">' + esc(opts.okText || '保存') + '</button>' +
        '</div>';
      var done = false;
      onSheetClose(function () { if (!done) resolve(null); });
      openSheet(html, function (root) {
        var input = root.querySelector('#prompt-input');
        root.querySelector('[data-act="no"]').onclick = function () { done = true; closeSheet(); resolve(null); };
        root.querySelector('[data-act="yes"]').onclick = function () {
          var v = input.value.trim();
          if (!v) { toast('还没有填写内容'); return; }
          done = true; closeSheet(); resolve(v);
        };
        input.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') root.querySelector('[data-act="yes"]').click();
        });
      });
    });
  }

  /* ---------- 复制 ---------- */

  async function copy(text, successMsg) {
    if (!text) { toast('没有可复制的内容'); return false; }
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
      } else {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '-1000px';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
      toast(successMsg || '已复制');
      return true;
    } catch (e) {
      toast('复制失败，请长按选中文字手动复制');
      return false;
    }
  }

  /* ---------- 选图 ---------- */

  function pickImages(multiple) {
    return new Promise(function (resolve) {
      var input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      if (multiple) input.multiple = true;
      input.style.position = 'fixed';
      input.style.left = '-9999px';
      document.body.appendChild(input);
      input.onchange = function () {
        var files = Array.prototype.slice.call(input.files || []);
        document.body.removeChild(input);
        resolve(files);
      };
      input.click();
    });
  }

  /* ---------- 图标 ---------- */

  var ICONS = {
    today: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4v6c0 4.4-3.4 7.4-8 8-4.6-.6-8-3.6-8-8V7l8-4z"/><path d="M9 12l2 2 4-4"/></svg>',
    calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>',
    knowledge: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h9a3 3 0 013 3v13H8a3 3 0 01-3-3z"/><path d="M17 7h2v13H8"/><path d="M9 9h5M9 12h5"/></svg>',
    settings: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.2M12 18.8V21M4.2 7.5l1.9 1.1M17.9 15.4l1.9 1.1M4.2 16.5l1.9-1.1M17.9 8.6l1.9-1.1"/></svg>',
    hat: '<svg class="hat" viewBox="0 0 48 48" fill="none" stroke="#141414" stroke-width="2.4" stroke-linejoin="round"><path d="M14 30V13c0-2 1.6-3 4-3h12c2.4 0 4 1 4 3v17" fill="#02a4dc"/><path d="M14 17h20" stroke="#fff" stroke-width="5"/><path d="M14 17h20" /><path d="M14 23h20"/><ellipse cx="24" cy="31" rx="17" ry="5" fill="#02a4dc"/><ellipse cx="24" cy="31" rx="17" ry="5"/></svg>'
  };

  function icon(name) { return ICONS[name] || ''; }

  return {
    mount: mount,
    esc: esc,
    toast: toast,
    loading: loading,
    openSheet: openSheet,
    onLongPress: onLongPress,
    justLongPressed: justLongPressed,
    actions: actions,
    unlockScrollIfIdle: unlockScrollIfIdle,
    closeSheet: closeSheet,
    onSheetClose: onSheetClose,
    confirm: confirm,
    prompt: prompt,
    copy: copy,
    pickImages: pickImages,
    icon: icon
  };
})();

/* backup.js — JSON 导出 / 导入
   导出内容：年级、课程与老师（含头像 Base64）、每日记录（老师原文 + 任务 + 勾选状态）、
             数学知识点、英语/PBL 提词结果、排序、普通设置。
   导出内容绝不包含 API Key。 */

window.Backup = (function () {
  var EXPORT_STORES = ['grades', 'courses', 'dailyRecords', 'mathKnowledge', 'wordRecords'];

  var SAFE_SETTINGS = ['currentGradeId', 'keepImages'];

  async function buildExport() {
    var payload = {
      app: 'xiaotao-homework', // 内部标识保持不变，老备份才能继续导入
      appVersion: APP.version,
      schemaVersion: Store.SCHEMA_VERSION,
      exportedAt: new Date().toISOString(),
      data: {}
    };
    for (var i = 0; i < EXPORT_STORES.length; i++) {
      payload.data[EXPORT_STORES[i]] = await DB.getAll(EXPORT_STORES[i]);
    }
    var settings = {};
    SAFE_SETTINGS.forEach(function (k) { settings[k] = Store.settings[k]; });
    payload.data.settings = settings; // 不含 apiKey / endpoint 认证信息
    return payload;
  }

  function fileName() {
    var d = new Date();
    return 'HM-作业备份-' +
      d.getFullYear() + '-' + Store.pad(d.getMonth() + 1) + '-' + Store.pad(d.getDate()) + '.json';
  }

  async function exportJSON() {
    var payload = await buildExport();
    var text = JSON.stringify(payload, null, 2);
    var blob = new Blob([text], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = fileName();
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    return { name: fileName(), size: text.length, payload: payload };
  }

  function summarize(payload) {
    var d = payload.data || {};
    var wordCount = (d.wordRecords || []).reduce(function (n, r) {
      return n + (r.words || []).length + (r.expressions || []).length;
    }, 0);
    var kpCount = (d.mathKnowledge || []).reduce(function (n, r) {
      return n + (r.coreKnowledge || []).length + (r.skills || []).length;
    }, 0);
    return {
      exportedAt: payload.exportedAt || '',
      grades: (d.grades || []).length,
      courses: (d.courses || []).length,
      records: (d.dailyRecords || []).length,
      knowledge: kpCount,
      words: wordCount
    };
  }

  function validate(payload) {
    if (!payload || typeof payload !== 'object') return '文件不是有效的 JSON 备份。';
    if (payload.app && payload.app !== 'xiaotao-homework') return '这不是本 App 的备份文件。';
    if (!payload.data || typeof payload.data !== 'object') return '备份缺少 data 字段，无法恢复。';
    var v = payload.schemaVersion;
    if (typeof v !== 'number') return '备份缺少 schemaVersion，无法确认版本。';
    if (v > Store.SCHEMA_VERSION) return '备份来自更新版本的 App（v' + v + '），请先升级后再导入。';
    return null;
  }

  function readFile(file) {
    return new Promise(function (resolve, reject) {
      var r = new FileReader();
      r.onerror = function () { reject(new Error('读取文件失败')); };
      r.onload = function () {
        try { resolve(JSON.parse(r.result)); }
        catch (e) { reject(new Error('文件不是有效的 JSON')); }
      };
      r.readAsText(file);
    });
  }

    var d = payload.data || {};
    for (var i = 0; i < EXPORT_STORES.length; i++) {
      var store = EXPORT_STORES[i];
      await DB.clear(store);
      var rows = (d[store] || []).filter(function (r) { return r && r.id; });
      await DB.bulkPut(store, rows);
    }
    if (d.settings) {
      for (var k = 0; k < SAFE_SETTINGS.length; k++) {
        var key = SAFE_SETTINGS[k];
        if (key in d.settings) await Store.setSetting(key, d.settings[key]);
      }
    }
    // API Key 不在备份里，保持本机原值不变
    return summarize(payload);
  }

  function pickFile() {
    return new Promise(function (resolve) {
      var input = document.createElement('input');
      input.type = 'file';
      input.accept = 'application/json,.json';
      input.style.position = 'fixed';
      input.style.left = '-9999px';
      document.body.appendChild(input);
      input.onchange = function () {
        var f = (input.files || [])[0] || null;
        document.body.removeChild(input);
        resolve(f);
      };
      input.click();
    });
  }

  return {
    buildExport: buildExport,
    exportJSON: exportJSON,
    importJSON: importJSON,
    summarize: summarize,
    validate: validate,
    readFile: readFile,
    pickFile: pickFile,
    fileName: fileName
  };
})();

/* router.js — hash 路由。
   路由都放在 hash 里，GitHub Pages 子目录部署不需要任何服务器改写。 */

window.Router = (function () {
  var routes = {};
  var current = null;
  var scrollMemo = {};

  function parse() {
    var h = location.hash.replace(/^#/, '');
    if (!h || h === '/') h = '/today';
    var qi = h.indexOf('?');
    var path = qi < 0 ? h : h.slice(0, qi);
    var query = {};
    if (qi >= 0) {
      h.slice(qi + 1).split('&').forEach(function (kv) {
        if (!kv) return;
        var p = kv.split('=');
        query[decodeURIComponent(p[0])] = decodeURIComponent(p.slice(1).join('=') || '');
      });
    }
    return { path: path, query: query };
  }

  function on(path, handler) { routes[path] = handler; }

  function go(path, query) {
    var q = '';
    if (query) {
      q = '?' + Object.keys(query).map(function (k) {
        return encodeURIComponent(k) + '=' + encodeURIComponent(query[k]);
      }).join('&');
    }
    location.hash = path + q;
  }

  function back(fallback) {
    if (history.length > 1) history.back();
    else go(fallback || '/today');
  }

  async function render() {
    var r = parse();
    UI.unlockScrollIfIdle(); // 换页时确保背景滚动没被上一页的抽屉锁住
    if (current) scrollMemo[current] = window.scrollY;
    current = r.path;
    var handler = routes[r.path] || routes['/today'];
    try {
      await handler(r.query);
    } catch (e) {
      console.error(e);
      UI.toast('页面加载出错，已返回今天');
      if (r.path !== '/today') { go('/today'); return; }
    }
    window.scrollTo(0, 0);
    highlightNav(r.path);
  }

  var NAV_PARENT = {
    '/today': 'today',
    '/course': 'today',
    '/calendar': 'today',
    '/knowledge': 'knowledge',
    '/settings': 'settings',
    '/grades': 'settings',
    '/courses': 'settings',
    '/data': 'settings'
  };

  function highlightNav(path) {
    var key = NAV_PARENT[path] || 'today';
    document.querySelectorAll('.bottom-nav button').forEach(function (b) {
      b.classList.toggle('on', b.dataset.tab === key);
    });
  }

  function start() {
    window.addEventListener('hashchange', render);
    render();
  }

  return { on: on, go: go, back: back, start: start, render: render, parse: parse };
})();
